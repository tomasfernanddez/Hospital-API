        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Filter by doctor ID
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
          examples:
          - '2026-12-10'
        description: UTC calendar day in current implementation; range [00:00, next 00:00)
      - name: documentNumber
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{7,10}$
          examples:
          - '30111222'
        description: Exact patient document number
      - name: patientName
        in: query
        required: false
        schema:
          type: string
          minLength: 2
          examples:
