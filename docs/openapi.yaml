# Hospital API - OpenAPI contract - Clase 8 + existing Clase 7 routes
openapi: 3.2.1
info:
  title: Hospital API
  summary: Pacientes, médicos, enfermeros, turnos y especialidades
  description: API REST educativa. Recursos de Users y Auth conservados de Clase 7. Los endpoints de CRUD y búsqueda
    siguen el MVP de Clase 8.
  version: 1.0.0
servers:
- url: http://localhost:3000
  description: Local
security: []
tags:
- name: Health
  description: Estado del servicio
- name: Users
  description: Usuarios de Clase 7
- name: Auth
  description: Inicio de sesión heredado de Clase 7
- name: Patients
  description: Pacientes
- name: Doctors
  description: Médicos y especialidad
- name: Nurses
  description: Enfermeros
- name: Appointments
  description: Turnos entre pacientes y médicos
- name: Specialties
  description: Catálogo de solo lectura
paths:
  /api/health:
    get:
      tags:
      - Health
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: API is up
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    examples:
                    - ok
              example:
                status: ok
  /api/patients:
    get:
      tags:
      - Patients
      summary: listPatients
      operationId: listPatients
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Patient'
              example:
                data:
                - &id001
                  id: 1
                  firstName: Ada
                  lastName: Lovelace
                  documentNumber: '30111222'
                  birthDate: '1985-12-10'
    post:
      tags:
      - Patients
      summary: createPatient
      operationId: createPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInput'
            example:
              firstName: Ada
              lastName: Lovelace
              documentNumber: '30111222'
              birthDate: '1985-12-10'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Patient'
              example:
                data: *id001
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/patients/search:
    get:
      tags:
      - Patients
      summary: searchPatients
      operationId: searchPatients
      parameters:
      - name: keywords
        in: query
        required: false
        schema:
          type: string
          examples:
          - house
        description: Case-insensitive partial first/last name match
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Patient'
              example:
