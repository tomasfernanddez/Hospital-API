components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Positive integer identifier
      schema:
        type: integer
        minimum: 1
  schemas:
    Error:
      type: object
      additionalProperties: true
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: true
          required:
          - code
          - message
          properties:
            code:
              type: string
              examples:
              - VALIDATION_ERROR
            message:
              type: string
              examples:
              - Invalid request body
            details:
              type: array
              items:
                type: string
    PatientInput:
      type: object
      additionalProperties: false
      required:
      - firstName
      - lastName
      - documentNumber
      - birthDate
      properties: &id007
        firstName: &id008
          type: string
          minLength: 2
          maxLength: 120
          examples:
          - Ada
        lastName: &id009
          type: string
          minLength: 2
          maxLength: 120
          examples:
          - Lovelace
        documentNumber: &id010
          type: string
          pattern: ^[0-9]{7,10}$
          examples:
          - '30111222'
        birthDate: &id011
          type: string
          format: date
          examples:
          - '1985-12-10'
    PatientUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
